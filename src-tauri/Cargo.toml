[package]
name = "driftcord"
version = "0.4.17"
description = "A lightweight, debloated, themeable Discord desktop shell"
edition = "2021"
rust-version = "1.90"

[lib]
name = "driftcord_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2.14"
# Same version tauri already uses (for ResizeDirection in the custom title bar).
tauri-runtime = "~2.12.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
base64 = "0.22"
# Same HTTP stack the updater already ships, so mods add no extra weight.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(windows)'.dependencies]
# Native screen share: Windows Graphics Capture, WASAPI process loopback audio,
# small JPEG thumbnails, and WebView2 shared buffers to hand frames to the page.
windows-capture = "2.0.1"
wasapi = "0.26"
jpeg-encoder = "0.7"
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Storage_Xps",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# Smaller, faster binary.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Driftcord's own code (frame scaling, audio copying) at full speed; dependencies stay small.
[profile.release.package.driftcord]
opt-level = 3
