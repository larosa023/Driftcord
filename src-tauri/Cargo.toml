[package]
name = "driftcord"
version = "0.1.0"
description = "A lightweight, debloated, themeable Discord desktop shell"
edition = "2021"
rust-version = "1.90"

[lib]
name = "driftcord_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[profile.release]
# Smaller, faster binary.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
