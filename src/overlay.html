<!doctype html>
<!-- Driftcord's in-game voice overlay: a small click-through window drawn by src-tauri/src/overlay.rs.
     The app pushes the state in with window.__set(); this page has no access to the app or to Discord. -->
<html><head><meta charset="utf-8"><title>Driftcord overlay</title>
<style>
  :root { --s: 1; }
  html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; cursor: default; }
  body { font: 600 calc(14px * var(--s)) / 1 "Segoe UI", system-ui, sans-serif; color: #fff; padding: 7px 8px; box-sizing: border-box; }
  #list { display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; align-items: center; gap: calc(8px * var(--s)); height: calc(34px * var(--s)); box-sizing: border-box;
    padding: 0 calc(10px * var(--s)) 0 calc(3px * var(--s)); border-radius: calc(17px * var(--s));
    background: rgba(16, 17, 20, var(--bg, .78)); overflow: hidden; width: fit-content; max-width: 100%;
    transition: opacity 120ms; }
  .row.quiet { opacity: .72; }
  .av { position: relative; flex: none; width: calc(28px * var(--s)); height: calc(28px * var(--s)); border-radius: 50%;
    background: #5865f2 center / cover no-repeat; box-shadow: 0 0 0 calc(2px * var(--s)) transparent; transition: box-shadow 80ms; }
  .row.talking .av { box-shadow: 0 0 0 calc(2px * var(--s)) #3ba55d; }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .ico { flex: none; width: calc(14px * var(--s)); height: calc(14px * var(--s)); color: #f04747; }
  .more { font-size: calc(12px * var(--s)); opacity: .8; padding-left: calc(8px * var(--s)); text-shadow: 0 1px 2px rgba(0,0,0,.7); }
</style></head>
<body><div id="list"></div>
<script>
(() => {
  const list = document.getElementById('list');
  const SVG = {
    mute: '<svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-5.7-1.3L15 10.4V11a3 3 0 0 1-3 3Zm5-3a5 5 0 0 1-.6 2.3l1.5 1.5A7 7 0 0 0 19 11h-2ZM3.3 2.3 2 3.6l6 6V11a4 4 0 0 0 5.2 3.8l1.7 1.7A6.9 6.9 0 0 1 12 18a7 7 0 0 1-7-7H3a9 9 0 0 0 8 8.9V22h2v-2.1c1.2-.2 2.3-.6 3.3-1.3l3.1 3.1 1.3-1.3L3.3 2.3Z"/></svg>',
    deaf: '<svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 0 0-9 9v7a2 2 0 0 0 2 2h2v-8H5v-1a7 7 0 0 1 14 0v1h-2v8h2a2 2 0 0 0 2-2v-7a9 9 0 0 0-9-9Z"/><path d="M3.3 2.3 2 3.6 20.4 22l1.3-1.3L3.3 2.3Z"/></svg>',
  };
  const okUrl = (u) => {
    if (typeof u !== 'string') return '';
    if (u.startsWith('//')) u = 'https:' + u;
    try { const x = new URL(u); return x.protocol === 'https:' && /(^|\.)discordapp\.(com|net)$/.test(x.hostname) ? x.href : ''; } catch (_) { return ''; }
  };
  window.__set = (s) => {
    let st; try { st = typeof s === 'string' ? JSON.parse(s) : s; } catch (_) { return; }
    if (!st || !Array.isArray(st.rows)) return;
    document.documentElement.style.setProperty('--s', String(Math.min(1.6, Math.max(0.7, Number(st.scale) || 1))));
    document.documentElement.style.setProperty('--bg', String(Math.min(1, Math.max(0.3, Number(st.opacity) || 0.78))));
    const rows = st.rows.slice(0, 12).map((r) => {
      const row = document.createElement('div');
      row.className = 'row' + (r.speaking ? ' talking' : st.dimQuiet ? ' quiet' : '');
      const av = document.createElement('div'); av.className = 'av';
      const url = okUrl(r.avatar); if (url) av.style.backgroundImage = 'url("' + url + '")';
      const name = document.createElement('span'); name.className = 'name'; name.textContent = String(r.name || '').slice(0, 40);
      row.append(av, name);
      if (r.deaf || r.muted) row.insertAdjacentHTML('beforeend', r.deaf ? SVG.deaf : SVG.mute);
      return row;
    });
    if (st.more > 0) { const m = document.createElement('div'); m.className = 'more'; m.textContent = '+' + st.more + ' more'; rows.push(m); }
    list.replaceChildren(...rows);
  };
})();
</script></body></html>
