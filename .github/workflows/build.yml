name: Build & Release

# Every push to main builds Windows binaries and publishes them to the GitHub
# Release for the current version (tag v<version> from tauri.conf.json).
# The release and tag are created automatically if they don't exist yet; on
# later pushes with the same version the files are replaced with fresh builds.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build and publish release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Driftcord v__VERSION__
          releaseBody: |
            **Download `Driftcord_*_x64-setup.exe`** to install, or `Driftcord-portable.exe` to run without installing.

            Windows 10/11 (64-bit). Uses the WebView2 runtime that comes with Windows. Windows may show a SmartScreen warning because the app isn't code-signed: click **More info → Run anyway**.

            Not affiliated with Discord. Using a modified client is against Discord's Terms of Service; use at your own risk.
          releaseDraft: false
          prerelease: false

      - name: Attach portable exe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cp src-tauri/target/release/driftcord.exe Driftcord-portable.exe
          gh release upload "v$version" Driftcord-portable.exe --clobber
