name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Tagged push: build and publish a GitHub Release with the installer.
      - name: Build and release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Driftcord ${{ github.ref_name }}
          releaseBody: |
            **Download `Driftcord_*_x64-setup.exe`** to install, or `Driftcord-portable.exe` to run without installing.

            Windows 10/11 (64-bit). Uses the WebView2 runtime that comes with Windows.

            Not affiliated with Discord. Using a modified client is against Discord's Terms of Service; use at your own risk.
          releaseDraft: false
          prerelease: false

      - name: Attach portable exe
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp src-tauri/target/release/driftcord.exe Driftcord-portable.exe
          gh release upload "${{ github.ref_name }}" Driftcord-portable.exe --clobber

      # Manual run: just build and keep the files as a workflow artifact.
      - name: Build only
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: driftcord-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/driftcord.exe
